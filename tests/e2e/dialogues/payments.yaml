- name: payment_happy_path_with_receipt
  turns:
    - user: "Hi"
      expect_tools: []
    - user: "My account is ACC1001 and my verifier is 4321"
      expect_tools: [verify_identity]
      expect_state: AUTHENTICATED
    - user: "How much do I owe?"
      expect_tools: [get_bill]
    - user: "I'd like to pay it now"
      expect_tools: [prepare_payment]
      expect_state: PAYMENT_PENDING
      expect_reply: "84\\.50"
    - user: "Yes, go ahead"
      expect_tools: [initiate_payment]
      expect_state: SECURE_CAPTURE
    - card: {pan: "4111 1111 1111 1111", expiry: "12/30", cvv: "123"}
      expect_state: PAYMENT_RESULT
      expect_payment: succeeded
    - user: "Email me the receipt please"
      expect_tools: [send_receipt]
      expect_state: AUTHENTICATED
    - user: "What's my balance now?"
      expect_tools: [get_bill]
      expect_reply: "nothing|fully paid"
  final_state: AUTHENTICATED

- name: payment_declined
  turns:
    - user: "Account ACC1001 verifier 4321"
      expect_tools: [verify_identity]
    - user: "I want to pay my bill"
      expect_tools: [prepare_payment]
      expect_state: PAYMENT_PENDING
    - user: "yes"
      expect_tools: [initiate_payment]
      expect_state: SECURE_CAPTURE
    - card: {pan: "4000 0000 0000 0002", expiry: "12/30", cvv: "123"}
      expect_state: PAYMENT_RESULT
      expect_payment: failed
    - user: "No thanks"
      expect_tools: []
      expect_state: AUTHENTICATED

- name: payment_insufficient_funds_then_retry
  turns:
    - user: "Account ACC1003 verifier 5678"
      expect_tools: [verify_identity]
    - user: "Pay my balance"
      expect_tools: [prepare_payment]
      expect_reply: "210\\.00"
    - user: "Yes"
      expect_tools: [initiate_payment]
    - card: {pan: "4000 0000 0000 9995", expiry: "12/30", cvv: "123"}
      expect_payment: failed
    - user: "Yes, I'll try another card"
      expect_tools: [prepare_payment]
      expect_state: PAYMENT_PENDING
    - user: "Yes please"
      expect_tools: [initiate_payment]
      expect_state: SECURE_CAPTURE
    - card: {pan: "4111 1111 1111 1111", expiry: "12/30", cvv: "123"}
      expect_payment: succeeded
      expect_state: PAYMENT_RESULT

